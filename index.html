<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enarson Elementary TV</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  .slides-area {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% - 90px);
  }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    background: #000000;
  }

  .slide.active {
    opacity: 1;
    z-index: 1;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* ---- Welcome slide ---- */
  #slide-welcome {
    flex-direction: column;
    background: #000000;
    gap: 3vh;
  }

  .welcome-title {
    color: #ffffff;
    font-weight: bold;
    font-size: 6vh;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
    font-family: Arial, Helvetica, sans-serif;
    text-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
  }

  .welcome-title .accent {
    color: #ffcc00;
  }

  #slide-welcome img {
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    object-fit: fill;
  }

 /* ---- Bottom scrolling ticker ---- */
  .ticker-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 90px;
    background: #000000;
    color: #ffffff;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
    border-top: 3px solid #1fbfb0;
  }

  .ticker-label {
    flex: 0 0 auto;
    background: #1fbfb0;
    color: #000000;
    font-weight: bold;
    font-size: 30px;
    padding: 0 18px 0 30px;
    height: 100%;
    display: flex;
    align-items: center;
    z-index: 2;
  }

  .ticker-track {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
    height: 100%;
  }

  .ticker-content {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 33px;
    padding-right: 100px;
    animation: scroll-left linear infinite;
    /* animation-duration is set dynamically in JS based on text length */
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---- Photo collage slides ---- */
  #slide-photos-1,
  #slide-photos-2,
  #slide-photos-3,
  #slide-photos-4 {
    background: #0a0a0a url("background.png") center / cover no-repeat;
  }

  .photo-collage {
    position: relative;
    width: 100%;
    height: calc(100% - 90px);
  }

  .photo-tile {
    position: absolute;
    background: #000000;
    border: 6px solid #ffffff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.4s ease-in-out, transform 1.4s ease-in-out;
  }

  .photo-tile.visible {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="slides-area">
    <div class="slide active" id="slide-calendar">
      <iframe
        src="https://www.gobound.com/widgets/67aa3cf8b46247fc8947"
        allowtransparency="true">
      </iframe>
    </div>

    <div class="slide" id="slide-menu">
      <img src="VE_MENU.png" alt="Lunch Menu" onerror="this.dataset.broken='true';">
    </div>

    <div class="slide" id="slide-breakfast">
      <img src="VE_BREAKFAST.png" alt="Breakfast Menu" onerror="this.dataset.broken='true';">
    </div>

    <div class="slide" id="slide-menu-next">
      <img src="VE_MENU_9.png" alt="Next Month's Lunch Menu" onerror="this.dataset.broken='true';">
    </div>

    <div class="slide" id="slide-breakfast-next">
      <img src="VE_BREAKFAST_9.png" alt="Next Month's Breakfast Menu" onerror="this.dataset.broken='true';">
    </div>

    <div class="slide" id="slide-welcome">
      <img src="Welcome_Enarson.png" alt="Enarson Elementary Logo" onerror="this.dataset.broken='true';">
    </div>

    <div class="slide" id="slide-announcements">
      <!--
        Secretary's published Google Slides deck (3 slides, 10 sec each = 30 sec loop).
        If she republishes with a different slide count or delay, update the
        src below AND the ANNOUNCEMENTS_DURATION constant further down to match.
      -->
      <iframe
        src="https://docs.google.com/presentation/d/e/2PACX-1vSGiYSv0pK1maAsTXPf3_q2hUWXIEjWjHdvqj-kMUuJOhPuLt_L9mxU5WuuePILBDn1VqRU_tx49zgc/pubembed?start=true&loop=true&delayms=10000&rm=minimal"
        allowfullscreen="true">
      </iframe>
    </div>

    <div class="slide" id="slide-photos-1" data-empty="true">
      <div class="photo-collage" id="photo-collage-1"></div>
    </div>

    <div class="slide" id="slide-photos-2" data-empty="true">
      <div class="photo-collage" id="photo-collage-2"></div>
    </div>

    <div class="slide" id="slide-photos-3" data-empty="true">
      <div class="photo-collage" id="photo-collage-3"></div>
    </div>

    <div class="slide" id="slide-photos-4" data-empty="true">
      <div class="photo-collage" id="photo-collage-4"></div>
    </div>
  </div>

  <div class="ticker-bar">
    <div class="ticker-label">NEWS</div>
    <div class="ticker-track">
      <div class="ticker-content" id="ticker-content">Loading bulletin&hellip;</div>
    </div>
  </div>

  <script>
    // =========================================================
    // SLIDE ROTATION SETTINGS
    // =========================================================
    const CALENDAR_DURATION = 10000;
    const MENU_DURATION = 10000;
    const WELCOME_DURATION = 10000;
    const ANNOUNCEMENTS_DURATION = 29000; // her deck: 3 slides x 10 sec each
    const PHOTOS_DURATION = 12000; // each of the 4 photo slides shows its 3 photos for this long
    const PHOTO_SLIDE_IDS = ['slide-photos-1', 'slide-photos-2', 'slide-photos-3', 'slide-photos-4'];

    // ---- Monthly menu swap ----
    // VE_MENU.png is the current (August) menu; VE_MENU9.png is next
    // month's (September). VE_MENU9.png joins the rotation starting on
    // its start date, then VE_MENU.png drops out on its retire date --
    // both happen automatically (page auto-reloads hourly), no manual
    // edit needed on either day. Just rename files and update these two
    // lines each month going forward.
    const MENU_NEXT_START_DATE = new Date('2026-08-30T00:00:00');
    const MENU_RETIRE_DATE = new Date('2026-09-01T00:00:00');
    const now = new Date();
    const showOldMenu = now < MENU_RETIRE_DATE;
    const showNextMenu = now >= MENU_NEXT_START_DATE;

    const slides = [
      { el: document.getElementById('slide-calendar'), duration: CALENDAR_DURATION },
      ...(showOldMenu ? [{ el: document.getElementById('slide-menu'), duration: MENU_DURATION }] : []),
      ...(showOldMenu ? [{ el: document.getElementById('slide-breakfast'), duration: MENU_DURATION }] : []),
      ...(showNextMenu ? [{ el: document.getElementById('slide-menu-next'), duration: MENU_DURATION }] : []),
      ...(showNextMenu ? [{ el: document.getElementById('slide-breakfast-next'), duration: MENU_DURATION }] : []),
      { el: document.getElementById('slide-welcome'), duration: WELCOME_DURATION },
      { el: document.getElementById('slide-announcements'), duration: ANNOUNCEMENTS_DURATION },
      { el: document.getElementById('slide-photos-1'), duration: PHOTOS_DURATION },
      { el: document.getElementById('slide-photos-2'), duration: PHOTOS_DURATION },
      { el: document.getElementById('slide-photos-3'), duration: PHOTOS_DURATION },
      { el: document.getElementById('slide-photos-4'), duration: PHOTOS_DURATION }
    ];

    let current = 0;

    function slideIsBroken(slideEl) {
      const img = slideEl.querySelector('img');
      if (img && img.dataset.broken === 'true') return true;
      if (slideEl.id.indexOf('slide-photos-') === 0) {
        return slideEl.dataset.empty === 'true';
      }
      return false;
    }

    // Base embed URL for the secretary's Slides deck, kept separately so
    // we can re-append a cache-busting param each time we refresh it.
    const ANNOUNCEMENTS_BASE_SRC = "https://docs.google.com/presentation/d/e/2PACX-1vSGiYSv0pK1maAsTXPf3_q2hUWXIEjWjHdvqj-kMUuJOhPuLt_L9mxU5WuuePILBDn1VqRU_tx49zgc/pubembed?start=true&loop=true&delayms=10000&rm=minimal";

    function refreshAnnouncementsFrame() {
      const frame = document.querySelector('#slide-announcements iframe');
      if (frame) {
        frame.src = ANNOUNCEMENTS_BASE_SRC + "&cb=" + Date.now();
      }
    }

    function showSlide(index) {
      slides.forEach((s, i) => {
        s.el.classList.toggle('active', i === index);
      });
    }

    // Preload lead time: the announcements iframe gets refreshed this many
    // milliseconds BEFORE its slide is shown, so it's already fresh and
    // sitting on slide 1 (still hidden) the instant it becomes visible.
    const ANNOUNCEMENTS_PRELOAD_MS = 1000;

    function nextSlide() {
      let attempts = 0;
      do {
        current = (current + 1) % slides.length;
        attempts++;
      } while (slideIsBroken(slides[current].el) && attempts < slides.length);

      // Re-roll a photo slide's 3 photos right before it's shown again,
      // so each pass through the rotation shows a fresh set (see
      // refreshPhotoSlide, defined further down with the rest of the
      // photo collage logic).
      const currentId = slides[current].el.id;
      if (typeof refreshPhotoSlide === 'function' && PHOTO_SLIDE_IDS.indexOf(currentId) !== -1) {
        refreshPhotoSlide(currentId);
      }

      showSlide(current);

      // If the slide AFTER this one is the announcements slide, schedule
      // its preload-refresh to fire 1 second before it's due to appear.
      const upcomingIndex = (current + 1) % slides.length;
      if (slides[upcomingIndex].el.id === 'slide-announcements') {
        const leadTime = slides[current].duration - ANNOUNCEMENTS_PRELOAD_MS;
        setTimeout(refreshAnnouncementsFrame, Math.max(0, leadTime));
      }

      setTimeout(nextSlide, slides[current].duration);
    }

    setTimeout(nextSlide, slides[current].duration);

    // =========================================================
    // BOTTOM TICKER: pulls text from the published "Daily Bulletin"
    // Google Doc. The doc says it auto-updates every 5 minutes, so
    // this re-fetches on the same schedule.
    //
    // r.jina.ai converts the page into clean, pre-stripped plain
    // text (no CSS/script code to leak through), and also handles
    // the cross-origin permission issue for us.
    // =========================================================

    const DOC_URL = "https://docs.google.com/document/d/e/2PACX-1vRp_dkseO_baydiLxmcXV1eCO4IIlVUr03JeMbVh1mppP779rD5oqSizEBfkhjs1WugmIPubXPLUglf/pub";
    const REFRESH_MS = 5 * 60 * 1000; // 5 minutes, matches the doc's own update cadence

    // r.jina.ai caches its own responses per-URL for a few minutes. Appending
    // a changing query param each time (same trick used above for the
    // announcements iframe) makes every request a unique URL, so Jina can't
    // serve a stale cached copy back to us.
    function buildProxyUrl() {
      return "https://r.jina.ai/" + DOC_URL + "?cb=" + Date.now();
    }

    // Fallback text, shown only if the live fetch fails.
    const FALLBACK_TEXT = "Welcome to Enarson Elementary! Check back soon for daily announcements.";

    const tickerEl = document.getElementById('ticker-content');

    function setTickerText(text) {
      // Duplicate the text back-to-back (with a gap) so the scroll can
      // loop seamlessly at -50% -- see the @keyframes above.
      const gap = '          '; // spacing between the end of one loop and the start of the next
      tickerEl.textContent = text + gap + text + gap;
      // Speed: roughly 90 pixels per second, scaled to a single copy's length
      const estimatedWidth = text.length * 13; // rough px estimate
      const duration = Math.max(20, estimatedWidth / 180);
      tickerEl.style.animation = 'none';
      // force reflow so the animation restarts cleanly
      void tickerEl.offsetWidth;
      tickerEl.style.animation = `scroll-left ${duration}s linear infinite`;
    }

    function cleanExtractedText(rawText) {
      return rawText
        // strip any stray HTML tags and CSS-looking rule blocks that
        // could slip through as literal text
        .replace(/<[^>]*>/g, ' ')
        .replace(/\.[\w-]+\{[^}]*\}/g, ' ')
        .split('\n')
        .map(line => line.trim())
        .filter(line =>
          line.length > 0 &&
          !line.startsWith('Title:') &&
          !line.startsWith('URL Source:') &&
          !line.startsWith('Markdown Content:') &&
          !line.startsWith('Warning:') &&
          !line.startsWith('[') &&
          !line.includes('Updated automatically every') &&
          line !== 'Published using Google Docs' &&
          line !== 'Report abuse' &&
          line !== 'Learn more'
        )
        .join('   •   ')
        // collapse any repeated whitespace left over from cleanup
        .replace(/\s{2,}/g, ' ');
    }

    function fetchBulletin() {
      fetch(buildProxyUrl())
        .then(res => {
          if (!res.ok) throw new Error('Bad response');
          return res.text();
        })
        .then(rawText => {
          const cleaned = cleanExtractedText(rawText);
          if (cleaned && cleaned.length > 20) {
            setTickerText(cleaned);
          } else {
            throw new Error('Empty content');
          }
        })
        .catch(err => {
          console.warn('Bulletin fetch failed, using fallback text.', err);
          setTickerText(FALLBACK_TEXT);
        });
    }

    fetchBulletin();
    setInterval(fetchBulletin, REFRESH_MS);

    // =========================================================
    // PHOTO COLLAGE: teachers drop event photos into a shared Google
    // Drive folder ("anyone with the link can view"). We pull the
    // folder's file list through r.jina.ai (same cross-origin trick
    // used for the ticker above -- Drive's own folder page blocks
    // direct browser fetches, but jina proxies it and echoes back a
    // permissive CORS header). Drive embeds a big JSON blob of every
    // file in the folder as window['_DRIVE_ivd'] on the page; we pull
    // that out, keep only images, and use each file's ID to build a
    // public thumbnail URL. New photos show up automatically because
    // the whole page reloads hourly (see AUTO-REFRESH below).
    //
    // To point this at a different folder, just change PHOTOS_FOLDER_ID.
    // =========================================================
    const PHOTOS_FOLDER_ID = '1xaEHvvJ8ZGW9gn4MXLLerarg9t-wp9-Y';
    const PHOTOS_TILE_COUNT = 3; // photos shown per photo slide

    function photoUrl(fileId) {
      return `https://lh3.googleusercontent.com/d/${fileId}=s1000`;
    }

    // Drive's page embeds the folder's file listing as a hand-escaped JS
    // string (\x22 for quotes, \/ for slashes, \uXXXX for unicode) rather
    // than a normal JSON string literal, so it needs its own unescaper
    // instead of a plain JSON.parse-of-a-string trick.
    function unescapeDriveBlob(s) {
      return s.replace(/\\x([0-9a-fA-F]{2})|\\u([0-9a-fA-F]{4})|\\\\|\\\//g, (m, hex, uni) => {
        if (hex) return String.fromCharCode(parseInt(hex, 16));
        if (uni) return String.fromCharCode(parseInt(uni, 16));
        if (m === '\\\\') return '\\';
        if (m === '\\/') return '/';
        return m;
      });
    }

    function fetchPhotoIds() {
      const folderPageUrl = `https://drive.google.com/drive/folders/${PHOTOS_FOLDER_ID}`;
      const proxyUrl = `https://r.jina.ai/${folderPageUrl}?cb=${Date.now()}`;
      return fetch(proxyUrl, { headers: { 'X-Return-Format': 'html' } })
        .then(res => {
          if (!res.ok) throw new Error('Bad response fetching Drive folder');
          return res.text();
        })
        .then(html => {
          const match = html.match(/_DRIVE_ivd'\]\s*=\s*'((?:[^'\\]|\\.)*)'/);
          if (!match) throw new Error('Could not locate Drive file listing in page');
          const jsonText = unescapeDriveBlob(match[1]);
          const parsed = JSON.parse(jsonText);
          const files = parsed[0] || []; // wrapper array holds one array of file entries
          return files
            .filter(f => Array.isArray(f) && typeof f[3] === 'string' && f[3].indexOf('image/') === 0)
            .map(f => f[0]);
        });
    }

    // There are 4 photo slides, each showing a STATIC set of 3 photos
    // (no swapping while a slide is visible). All 4 slides draw from
    // one shared "don't repeat" queue, so a full loop through the
    // rotation shows 12 unique photos, and the NEXT loop shows the
    // next 12 -- only repeating once the whole ~40-photo pool has been
    // shown once. Each slide's photos are re-rolled from the queue
    // right before that slide becomes active again, using the same
    // preload-lead-time pattern as the announcements iframe refresh.
    // (PHOTO_SLIDE_IDS is declared up in SLIDE ROTATION SETTINGS.)
    let allPhotoIds = [];
    let photoQueue = [];

    function shuffledIndices(ids) {
      const arr = ids.map((_, i) => i);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Draws `count` unique photo indices from the shared queue, in
    // order, only reshuffling a fresh queue once the current one is
    // exhausted -- guarantees every photo appears once before any repeat.
    function drawPhotoIndices(count) {
      const result = [];
      while (result.length < count) {
        if (photoQueue.length === 0) photoQueue = shuffledIndices(allPhotoIds);
        result.push(photoQueue.shift());
      }
      return result;
    }

    function renderPhotoSlide(slideId, photoIndices) {
      const slideEl = document.getElementById(slideId);
      const container = slideEl.querySelector('.photo-collage');
      container.innerHTML = '';

      if (!photoIndices || photoIndices.length === 0) {
        slideEl.dataset.empty = 'true';
        return;
      }
      slideEl.dataset.empty = 'false';

      const tileCount = photoIndices.length;
      const COLUMN_WIDTH = 100 / tileCount;

      photoIndices.forEach((photoIndex, columnIndex) => {
        const tile = document.createElement('div');
        tile.className = 'photo-tile';

        const w = COLUMN_WIDTH * (0.8 + Math.random() * 0.16); // vw, mostly fills the column
        const h = 55 + Math.random() * 22; // % of the photo area's own height
        const columnLeft = COLUMN_WIDTH * columnIndex;
        const maxJitter = COLUMN_WIDTH - w;
        const left = columnLeft + Math.random() * Math.max(maxJitter, 0);
        const maxTop = 100 - h;
        const top = Math.random() * Math.max(maxTop, 0);
        const rotate = (Math.random() * 6 - 3).toFixed(1);
        tile.style.width = w + 'vw';
        tile.style.height = h + '%';
        tile.style.left = left + 'vw';
        tile.style.top = top + '%';
        tile.style.zIndex = String(1 + columnIndex);
        tile.style.transform = `rotate(${rotate}deg)`;
        tile.style.backgroundImage = `url("${photoUrl(allPhotoIds[photoIndex])}")`;

        container.appendChild(tile);
        // Fade in on the next frame so the opacity transition actually plays.
        requestAnimationFrame(() => requestAnimationFrame(() => tile.classList.add('visible')));
      });
    }

    // Re-roll a specific photo slide's 3 photos from the queue. Called
    // once up front for all 4 slides, and again each time a slide is
    // about to come back around in the rotation.
    function refreshPhotoSlide(slideId) {
      if (allPhotoIds.length === 0) return;
      renderPhotoSlide(slideId, drawPhotoIndices(Math.min(PHOTOS_TILE_COUNT, allPhotoIds.length)));
    }

    fetchPhotoIds()
      .then(ids => {
        allPhotoIds = ids;
        PHOTO_SLIDE_IDS.forEach(refreshPhotoSlide);
      })
      .catch(err => {
        console.warn('Photo collage fetch failed; slides will stay empty this load.', err);
      });

    // =========================================================
    // AUTO-REFRESH: reloads the whole page on a schedule so any
    // new deploy (updated index.html, changed image, etc.) gets
    // picked up automatically -- no need to physically visit the
    // Chromebook. Adjust the hours below to whatever cadence makes
    // sense; a smaller number means changes show up faster but the
    // screen blips/reconnects more often.
    // =========================================================
    const AUTO_RELOAD_HOURS = 1;
    setTimeout(() => {
      location.reload(true); // true forces a fresh fetch, bypassing cache
    }, AUTO_RELOAD_HOURS * 60 * 60 * 1000);
  </script>

</body>
</html>
